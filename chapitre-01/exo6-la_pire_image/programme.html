<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Programme</title>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let previousTime = null;
let frameCount = 0;
let longestFrame = 0;
let framesOver11ms = 0;

function loop(timestamp) {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (previousTime !== null) {
        const duration = timestamp - previousTime;

        if (duration > longestFrame) {
            longestFrame = duration;
        }

        if (duration > 11) {
            framesOver11ms++;
        }
    }

    previousTime = timestamp;
    frameCount++;

    if (frameCount <= 1000) {
        requestAnimationFrame(loop);
    } else {
        console.log("Images mesurées :", frameCount - 1);
        console.log("Image la plus longue :", longestFrame.toFixed(2), "ms");
        console.log("Images > 11 ms :", framesOver11ms);
    }
}

requestAnimationFrame(loop);
</script>
</body>
</html>
